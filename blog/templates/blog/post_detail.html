<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
</head>
<body>
    <article>
        <h1>{{ post.title }}</h1>
        <p>{{ post.created_at|date:"d/m/Y" }}</p>
        <div>{{ post.content|linebreaksbr }}</div>
    </article>
    <p><a href="{% url 'blog:post_list' %}">Back to posts</a></p>
</body>
</html>
