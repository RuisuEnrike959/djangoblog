{% extends 'blog/base.html' %}

{% block title %}Login - My Blog in Niigata{% endblock %}

{% block content %}

<section class="posts-section">

    <div class="container">

        <div class="section-header">
            <div>
                <span class="section-label">ACCOUNT</span>
                <h2>Login</h2>
            </div>
        </div>

        <div class="post-card">
            <div class="post-card-body">

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit">
                        Login
                    </button>
                </form>

                <p>
                    Don't have an account?
                    <a href="{% url 'blog:register' %}">
                        Register
                    </a>
                </p>

            </div>
        </div>

    </div>

</section>

{% endblock %}
